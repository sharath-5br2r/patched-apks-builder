[adobe-acrobat-hooman]
cli = "MorpheApp/morphe-cli"
appPkgName = "com.adobe.reader"
apkSrc = "apkmirror"
apkType = "bundle"
apkArchs = ["universal"]
appVersion = "latest"
[[adobe-acrobat-hooman.patches]]
name = "hooman"
repo = "arandomhooman/hoomans-morphe-patches"
src = "github"
tag = "prerelease"

[speedtest-xtra]
cli = "MorpheApp/morphe-cli"
pkgname = "org.zwanoo.android.speedtest"
apksrc = "apkmirror"
apktype = "apk"
archs = ["arm64-v8a", "x86_64"]
[[speedtest-xtra.patches]]
patchname = "xtra"
patchsrc = "BholeyKaBhakt/android-patches-xtra"
source = "github"

[tiktok-icysymmetra]
cli = "MorpheApp/morphe-cli"
pkgname = "com.zhiliaoapp.musically"
apksrc = "apkmirror"
apktype = "apk"
archs = ["arm64-v8a"]
[[tiktok-icysymmetra.patches]]
patchname = "icysymmetra"
patchsrc = "icysymmetra/tiktok-patches-for-morphe"
source = "github"

[youtube-morphe]
cli = "MorpheApp/morphe-cli"
module = "true"
pkgname = "com.google.android.youtube"
apksrc = "apkmirror"
apktype = "apk"
archs = ["universal"]
version_cmd = "get_experimental_version com.google.android.youtube"
[[youtube-morphe.patches]]
patchname = "morphe"
patchsrc = "MorpheApp/morphe-patches"
source = "github"
clioptions = "-e 'Custom branding' -OcustomName='YouTube Morphe' -e Theme -OdarkThemeBackgroundColor=#000000 -d 'Custom Header'"
rootclioptions = "-d 'GmsCore Support'"

[youtube-music-morphe]
cli = "MorpheApp/morphe-cli"
module = "true"
pkgname = "com.google.android.apps.youtube.music"
apksrc = "apkmirror"
apktype = "apk"
archs = ["arm64-v8a", "x86_64"]
version_cmd = "get_experimental_version com.google.android.apps.youtube.music"
[[youtube-music-morphe.patches]]
patchname = "morphe"
patchsrc = "MorpheApp/morphe-patches"
source = "github"
clioptions = "-e 'Custom branding' -OcustomName='YouTube Morphe' -e Theme -OdarkThemeBackgroundColor=#000000"
rootclioptions = "-d 'GmsCore Support'"

