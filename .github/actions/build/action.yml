name: Build and Patch APKs
description: This workflow builds and patches APKs for various applications.
inputs:
  github_token:
    description: "GitHub token for authentication"
    required: true
  build_target:
    description: "The target application to build and patch"
    required: true
  keystore:
    description: "Base64 encoded keystore for signing APKs"
    required: true
  keystore_pass:
    description: "Password for the keystore"
    required: true
  keystore_alias:
    description: "Alias for the keystore"
    required: true
  release_name:
    description: "Name of the release"
    required: true
  release_tag:
    description: "Tag for the release"
    required: true
runs:
  using: "composite"
  steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Decode Keystore
      shell: bash
      run: |
        echo "${{ inputs.keystore }}" | base64 --decode > ks.keystore
    - name: Preparing to patch
      uses: ./.github/actions/preparing
    - name: Check github connection
      id: check-gh
      shell: bash
      run: bash src/etc/connection.sh
    - name: Patch apk
      id: patch
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        KEYSTORE_PASS: ${{ inputs.keystore_pass }}
        KEYSTORE_ALIAS: ${{ inputs.keystore_alias }}
        GITHUB_REPOSITORY: $GITHUB_REPOSITORY
      if: steps.check-gh.outputs.internet_error == '0'
      run: |
       bash src/build/build.sh ${{ inputs.build_target }}
    - name: Releasing APK files
      id: release
      if: steps.check-gh.outputs.internet_error == '0'
      uses: ./.github/actions/release
      with:
        name: ${{ inputs.release_name }}
        tag: ${{ inputs.release_tag }}