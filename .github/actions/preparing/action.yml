name: Preparing to patch
runs:
  using: "composite"
  steps:
    - name: Set up jdk
      uses: actions/setup-java@v5.2.0
      with:
        distribution: 'zulu'
        java-version: '21'
    - name: Start Byparr
      shell: bash
      run: |
        docker run -d -p 8191:8191 ghcr.io/thephaseless/byparr:latest
        echo "[*] Waiting for Byparr to start..."
        for i in $(seq 1 30); do
          if curl -s http://localhost:8191/ > /dev/null 2>&1; then
            echo "[+] Byparr is ready."
            break
          fi
          sleep 2
        done
