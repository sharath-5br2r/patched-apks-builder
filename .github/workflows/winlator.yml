name: Android CI Bionic
permissions: write-all
on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Get Winlator tag
      id: get_tag
      run:  |
        echo "TAG=$(gh release view -R StevenMXZ/Winlator-Ludashi --json tagName --jq '.tagName' )" >> $GITHUB_ENV
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        repository: StevenMXZ/Winlator-Ludashi
        ref: ${{ env.TAG }}

    - name: Clone linkernsbypass
      run: |
        mkdir -p app/src/main/cpp/adrenotools/lib
        git clone https://github.com/Pipetto-crypto/liblinkernsbypass.git app/src/main/cpp/adrenotools/lib/linkernsbypass

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Shader Compiler
      run: sudo apt-get update && sudo apt-get install -y glslang-tools

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Patch
      run: |
        sed -i 's#<string name="app_name">Winlator Ludashi</string>#<string name="app_name">Winlator (PUBG:VN)</string>#' app/src/main/res/values/strings.xml
        sed -i 's/applicationId = "com\.winlator\.cmod"/applicationId = "com.pubg.vnmobile"/' app/build.gradle
    - name: Build with Gradle
      run: ./gradlew assembleRelease --no-daemon

    - name: Sign apk 
      id: sign_apk
      run: |
        echo "${{ secrets.KEYSTORE }}" | base64 --decode > ks.keystore   
        bcversion=$(curl -fsSL https://repo1.maven.org/maven2/org/bouncycastle/bcprov-jdk18on/maven-metadata.xml | grep -oPm1 '(?<=<release>)[^<]+')
        echo -e "\e[32m[+] Downloading Bouncy Castle Provider\e[0m"
        wget -qO bcprov.jar "https://repo1.maven.org/maven2/org/bouncycastle/bcprov-jdk18on/$bcversion/bcprov-jdk18on-$bcversion.jar"
        LAST_PROV=$(grep "^security.provider\." "$JAVA_HOME/conf/security/java.security"  | grep -oP '(?<=security\.provider\.)\d+' | sort -n | tail -1)
        echo "security.provider.$((LAST_PROV+1))=org.bouncycastle.jce.provider.BouncyCastleProvider"  > bc.security
        wget -qO sdk.zip "https://dl.google.com/android/repository/build-tools_r36_linux.zip"
        unzip -q -j sdk.zip android-16/lib/apksigner.jar
        java -cp "bcprov.jar:apksigner.jar" com.android.apksigner.ApkSignerTool sign --ks-provider-class org.bouncycastle.jce.provider.BouncyCastleProvider  --provider-class org.bouncycastle.jce.provider.BouncyCastleProvider --ks ks.keystore --ks-type BKS --ks-key-alias $KEYSTORE_ALIAS --ks-pass pass:$KEYSTORE_PASS --in "app/build/outputs/apk/release/app-release.apk" --out "winlator-pubgvn-$TAG.apk"
      env:
        KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Release
      uses: ncipollo/release-action@v1.21.0
      with:
          artifacts: |
              ./winlator-pubgvn-$TAG.apk
          name: "Winlator (PUBG:VN)"
          tag: "winlator-pubgvn"
          allowUpdates: true
          makeLatest: true
          body: "Winlator dynamically patched for PUBG:VN, using Github Actions. Version ${{env.TAG}}"