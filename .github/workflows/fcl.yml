name: Build and Patch FCL into CoD Mobile
permissions: write-all
on:
  workflow_call:
  workflow_dispatch:

jobs:
  release_build:
    name: Build for all
    env:
      CURSE_API_KEY: "$2a$10$bL4bIL5pUWqfcO7KQtnMReakwtfHbNKh6v1uTpKlzhwoueEJQnPnm"
      OAUTH_API_KEY: ${{ secrets.FCL_OAUTH_KEY }}
    runs-on: ubuntu-latest
    steps:
      - name: Get FCL tag
        id: get_tag
        run:  |
            echo "TAG=$(gh release view -R FCL-Team/FoldCraftLauncher --json tagName --jq '.tagName' )" >> $GITHUB_ENV
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ env.TAG }}
          repository: FCL-Team/FoldCraftLauncher

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17
    
      - name: Patch
        run: |
          sed -i 's/signingConfig = signingConfigs\.getByName("FCLKey")/signingConfig = signingConfigs.getByName("FCLDebugKey")/' FCL/build.gradle.kts
          sed -i 's/applicationId = "com\.tungsten\.fcl"/applicationId = "com.activision.callofduty.shooter"/' FCL/build.gradle.kts
          sed -i 's#<string name="app_name" translatable="false">Fold Craft Launcher</string>#<string name="app_name" translatable="false">Fold Craft Launcher (CoDM)</string>#' FCL/src/main/res/values/strings.xml

      - name: Build All .apk
        run: |
          chmod +x gradlew
          ./gradlew assemblerelease -Darch=all --no-daemon
      - name: Setup Keystore and resign with own signature
        run: |
            echo "${{ secrets.KEYSTORE }}" | base64 --decode > ks.keystore   
            bcversion=$(curl -fsSL https://repo1.maven.org/maven2/org/bouncycastle/bcprov-jdk18on/maven-metadata.xml | grep -oPm1 '(?<=<release>)[^<]+')
            echo -e "\e[32m[+] Downloading Bouncy Castle Provider\e[0m"
            wget -qO bcprov.jar "https://repo1.maven.org/maven2/org/bouncycastle/bcprov-jdk18on/$bcversion/bcprov-jdk18on-$bcversion.jar"
            LAST_PROV=$(grep "^security.provider\." "$JAVA_HOME/conf/security/java.security"  | grep -oP '(?<=security\.provider\.)\d+' | sort -n | tail -1)
            echo "security.provider.$((LAST_PROV+1))=org.bouncycastle.jce.provider.BouncyCastleProvider"  > bc.security
            wget -qO sdk.zip "https://dl.google.com/android/repository/build-tools_r36_linux.zip"
            unzip -q -j sdk.zip android-16/lib/apksigner.jar
            java -cp "bcprov.jar:apksigner.jar" com.android.apksigner.ApkSignerTool sign --ks-provider-class org.bouncycastle.jce.provider.BouncyCastleProvider  --provider-class org.bouncycastle.jce.provider.BouncyCastleProvider --ks ks.keystore --ks-type BKS --ks-key-alias $KEYSTORE_ALIAS --ks-pass pass:$KEYSTORE_PASS --in ./FCL/build/outputs/apk/release/*.apk --out "./fcl-cod-$TAG.apk"
        env:
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        uses: ncipollo/release-action@v1.21.0
        with:
          artifacts: |
            ./fcl-cod*.apk
          name: "Fold Craft Launcher"
          tag: "fcl-cod"
          allowUpdates: true
          makeLatest: true
          body: "FCL Dynamic Patching for COD Mobile, uses Github Actions of patch before compiling. Version ${{env.TAG}}"
      - name: Upload to Archive Release
        uses: ncipollo/release-action@v1.21.0
        with:
          artifacts: |
            ./fcl-cod*.apk
          name: "Old APKs"
          tag: "archive"
          allowUpdates: true
          body: "This release contains all the old APKs that have been patched and released in the past. You can download any of the old APKs from this release."